name: Update README with Spotify (Serverless)

on:
  schedule:
    - cron: "*/10 * * * *" # Every 10 minutes
  workflow_dispatch: # Manual trigger button
  push:
    branches: [main]
    paths: [".github/workflows/update-readme.yml"] # Only when workflow changes

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Debug secrets (without exposing them)
        run: |
          echo "🔐 Checking if secrets are available..."
          if [ -n "${{ secrets.SPOTIFY_CLIENT_ID }}" ]; then
            echo "✅ SPOTIFY_CLIENT_ID is set"
          else
            echo "❌ SPOTIFY_CLIENT_ID is missing"
            exit 1
          fi

          if [ -n "${{ secrets.SPOTIFY_CLIENT_SECRET }}" ]; then
            echo "✅ SPOTIFY_CLIENT_SECRET is set"
          else
            echo "❌ SPOTIFY_CLIENT_SECRET is missing"
            exit 1
          fi

          if [ -n "${{ secrets.SPOTIFY_REFRESH_TOKEN }}" ]; then
            echo "✅ SPOTIFY_REFRESH_TOKEN is set"
          else
            echo "❌ SPOTIFY_REFRESH_TOKEN is missing"
            exit 1
          fi

      - name: 🎵 Get Spotify access token
        run: |
          echo "🎵 Exchanging refresh token for an access token..."

          TOKEN_RESPONSE=$(curl -s -X POST "https://accounts.spotify.com/api/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.SPOTIFY_REFRESH_TOKEN }}" \
            -d "client_id=${{ secrets.SPOTIFY_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SPOTIFY_CLIENT_SECRET }}")

          echo "Token response status: $(echo $TOKEN_RESPONSE | jq -r 'if .error then "ERROR: " + .error else "SUCCESS" end')"

          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "⚠️ Failed to get access token; update-readme.js will fall back gracefully."
          else
            echo "✅ Access token obtained"
            echo "::add-mask::$ACCESS_TOKEN"
            echo "SPOTIFY_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 📦 Install render dependencies
        run: npm ci

      - name: 🔍 Locate Chrome for 3D rendering
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "✅ Chrome found at $candidate"
              echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "❌ No Chrome binary available on this runner"
          exit 1

      - name: 📝 Update README
        id: update_readme
        env:
          SPOTIFY_ACCESS_TOKEN: ${{ env.SPOTIFY_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          echo "📝 Rendering 3D plate and regenerating README + scene SVG..."

          if [ ! -f "update-readme.js" ]; then
            echo "❌ update-readme.js not found!"
            exit 1
          fi

          if node update-readme.js; then
            echo "readme_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "readme_updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Commit and push changes
        if: steps.update_readme.outputs.readme_updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add README.md spotify-tv.svg .last-song.json
          if git diff --cached --quiet; then
            echo "🔄 No changes to commit (scene unchanged)"
            exit 0
          fi

          echo "✅ Changes detected, committing..."
          git commit -m "🎵 Update scene: $(node -e "try{console.log(require('./.last-song.json').track+' by '+require('./.last-song.json').artist)}catch(e){console.log('now playing')}")"
          git pull --rebase -X theirs origin main
          git push

          echo "🎉 README updated and pushed successfully!"
